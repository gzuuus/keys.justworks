[package]
name = "keys-justworks-server"
version = "0.1.4"
edition = "2021"
publish = false

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = "8"
mime_guess = "2"

# Storage + auth for the stateless locker.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

# Perimeter: hash SvelteKit's bootstrap inline script into the CSP header.
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
http = "1"
