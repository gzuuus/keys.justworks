<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f5f1e8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta
			name="description"
			content="Non-custodial Nostr key locker. Your encrypted key is stored on a server that can't decrypt it or link it to your identity. Retrieve and sign from any device."
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="contents">%sveltekit.body%</div>
		<!-- On-brand boot splash: painted from static HTML while the SPA boots,
		     outside SvelteKit's mount container so it survives mounting. Styled
		     from layout.css (CSP allows no inline styles); the app removes it via
		     $lib/boot-splash once the intro / hero is ready to paint. -->
		<div id="boot-splash" aria-hidden="true">
			<img src="%sveltekit.assets%/key-mark.svg" alt="" width="177" height="87" />
			<p>keys.justworks</p>
		</div>
	</body>
</html>
